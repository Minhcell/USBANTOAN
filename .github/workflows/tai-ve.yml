name: Tai ve (link co dinh)

# Tự động: mỗi lần bản build ở trên chạy xong thành công, file APK/EXE/HTML
# được đưa vào bản phát hành "tai-ve" với đường link cố định:
#   https://github.com/Minhcell/USBANTOAN/releases/download/tai-ve/<TEN_FILE>
on:
  workflow_run:
    workflows:
      - "Build USB AN TOAN (1 file EXE)"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: tai-ve
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Chọn bản build
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID="${{ github.event.workflow_run.id }}"; SHA="${{ github.event.workflow_run.head_sha }}"
          if [ -z "$ID" ]; then
            # Bấm tay: lấy bản build thành công gần nhất
            for w in build.yml; do
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$w/runs?status=success&per_page=1" --jq '.workflow_runs[0]|"\(.id) \(.head_sha) \(.updated_at)"' || true
            done | sort -k3 | tail -1 > r.txt
            ID=$(cut -d' ' -f1 r.txt); SHA=$(cut -d' ' -f2 r.txt)
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"; echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Lấy file đã build
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          path: art

      - name: Gom file tải về
        run: |
          mkdir -p out
          REPO="${GITHUB_REPOSITORY#*/}"
          put() {  # put <file> <name>
            b=$(echo "$2" | sed -E 's/[-_]build[-_]?[0-9]+//; s/[-_]v?[0-9]+(\.[0-9]+)+//; s/-debug(\.apk)$/\1/')
            case "$b" in app-debug.apk|app-release.apk|app-release-unsigned.apk|app.apk) b="$REPO.apk";; esac
            [ -e "out/$b" ] && b="$n-$b"
            cp "$1" "out/$b"
          }
          for a in art/*/; do
            n=$(basename "$a")
            case "$n" in github-pages*) continue;; esac
            cnt=$(find "$a" -type f | wc -l); top=$(find "$a" -mindepth 1 -maxdepth 1 -type f | wc -l)
            if [ "$cnt" -le 5 ] && [ "$cnt" = "$top" ]; then
              for f in "$a"*; do put "$f" "$(basename "$f")"; done
            else
              z=$(echo "$n" | sed -E 's/[-_]build[-_]?[0-9]+//; s/[-_]v?[0-9]+(\.[0-9]+)+//')
              (cd "$a" && zip -qr9 "$GITHUB_WORKSPACE/out/$z.zip" .)
            fi
          done
          find out -type f -size +1900M -print -delete
          ls -la out

      - name: Cập nhật bản phát hành "tai-ve"
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.run.outputs.sha }}
        run: |
          R="$GITHUB_REPOSITORY"
          NOTES="Bản build tự động mới nhất (commit ${SHA:0:7}, $(TZ=Asia/Ho_Chi_Minh date '+%d/%m/%Y %H:%M')). Link cố định: https://github.com/$R/releases/download/tai-ve/<TEN_FILE>"
          if gh release view tai-ve -R "$R" >/dev/null 2>&1; then
            gh release edit tai-ve -R "$R" --title "Tải về – bản mới nhất" --notes "$NOTES"
          else
            gh release create tai-ve -R "$R" --title "Tải về – bản mới nhất" --notes "$NOTES" --target "$SHA" --latest
          fi
          gh release upload tai-ve out/* -R "$R" --clobber
          if [ "1" = "1" ]; then  # xoá file cũ không còn dùng
            gh release view tai-ve -R "$R" --json assets --jq '.assets[].name' | while read -r x; do
              [ -e "out/$x" ] || gh release delete-asset tai-ve "$x" -R "$R" -y || true
            done
          fi
          git init -q t && cd t && git remote add o "https://x-access-token:$GH_TOKEN@github.com/$R" && git fetch -q --depth 1 o "$SHA" && git tag -f tai-ve FETCH_HEAD && git push -qf o refs/tags/tai-ve || true

